name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test modules
        run: ./gradlew --no-daemon build

  neoforge-1-21-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Publish versioned modules
        run: ./gradlew --no-daemon publishModules
      - name: Build and verify side jars
        run: ./gradlew -p platforms/neoforge-1.21.1 --no-daemon build
