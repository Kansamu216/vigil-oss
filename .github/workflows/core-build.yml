name: core-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build shared core
        run: ./gradlew --no-daemon build

# Public export/surface checks are added with the M3 exporter. Manual copies
# are not considered valid public releases.
